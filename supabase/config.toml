
[auth]
site_url = "https://rescue4pawz.site"
additional_redirect_urls = [
  "https://rescue4pawz.site/**",
  "https://ship.rescue4pawz.site/**",
  "http://localhost:5173/**",
  "http://localhost:5174/**"
]

[functions.send-approval-email]
enabled = true
verify_jwt = false
import_map = "./functions/send-approval-email/deno.json"
entrypoint = "./functions/send-approval-email/index.ts"

[functions.geocode-address]
enabled = true
verify_jwt = false
entrypoint = "./functions/geocode-address/index.ts"

